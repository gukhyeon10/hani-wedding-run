<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>하니의 결혼식장까지 살아남기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171923;color:white;font-family:system-ui,"Malgun Gothic",sans-serif;display:grid;place-items:center;padding:14px}.wrap{width:min(100%,980px)}.top,.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top{margin-bottom:10px}h1{font-size:clamp(20px,4vw,30px);margin:0;font-weight:1000}.pill{background:#292d3b;border:1px solid #555;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:900}.gamebox{position:relative;border:3px solid white;border-radius:18px;overflow:hidden;background:#a9e7ff;box-shadow:0 12px 0 #080910}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#111827d9;padding:15px}.panel{max-width:560px;background:white;color:#20202a;border:4px solid #20202a;border-radius:18px;padding:22px;box-shadow:8px 8px 0 #ff4e88}.panel h2{font-size:clamp(25px,5vw,42px);margin:0 0 8px;line-height:1.1}.panel p{font-weight:750;line-height:1.55}.big{font-size:42px}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;border:0;background:#ff4e88;color:white;font-weight:1000;font-size:17px;padding:13px 24px;border-radius:12px;box-shadow:0 5px 0 #a82254;cursor:pointer;margin-top:8px}.controls{margin-top:12px;color:#d9dbea;font-size:13px;font-weight:800}.touch{display:none;gap:8px}.touch button{margin:0;padding:14px 18px;min-height:50px;font-size:16px;touch-action:manipulation}@media(max-width:650px){.touch{display:flex;width:100%;justify-content:center}.touch button{flex:1;max-width:220px}.desktop{display:none}.controls{justify-content:center}.gamebox{width:100%}}
</style></head><body><div class="wrap"><div class="top"><h1>💍 하니의 결혼식장까지 살아남기</h1><span class="pill">난이도: 하드코어 · 자비 없음</span></div>
<div class="gamebox"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="big">🏃‍♂️💨</div><h2>식장까지 60초</h2><p>표지판을 따라 하니의 결혼식장으로 가라!<br>근데 길이 왜 이 모양이지?</p><p>SPACE / ↑ : 점프<br>장애물에 닿으면 즉시 사망 · 60초 버티면 도착</p><p>※ 현실의 지각은 게임 오버보다 무섭습니다.</p><button id="start">운명의 질주 시작</button></div></div></div>
<div class="controls"><span class="desktop">키보드: SPACE 또는 ↑ 점프 · R 재시작</span><span>남은 시간: 60초 · 난이도: 지옥 · 연속 장애물 주의</span><div class="touch"><button id="jump">점프! ⬆</button><button id="restart">다시 시작</button></div></div></div>
<script>
(()=>{
const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),W=960,H=540,ground=430,TOTAL=60;
let state='ready',last=0,time=0,world=0,speed=570,player,obstacles=[],bits=[],spawn=0,passed=0,signs=[];
const silly=[['🧦','짝 잃은 양말'],['🪑','갑자기 놓인 의자'],['🧻','축의금 영수증 폭탄'],['🦆','청첩장 훔치는 오리'],['🪴','대형 화분'],['🍉','미끄러운 수박'],['🧍','길막하는 친척'],['📦','정체불명 답례품'],['💐','거대 부케'],['🧹','빗자루의 반란'],['🐔','예식장 탈주 닭'],['🧊','바닥의 얼음덩이'],['🎂','굴러오는 3단 케이크'],['📸','플래시 카메라'],['🧾','축의금 계좌번호 안내판'],['⚽','축구공'],['🖥️','피씨방'],['🎬','영화관']];
function reset(){time=world=passed=0;speed=570;spawn=.55;obstacles=[];bits=[];player={y:ground-62,vy:0,h:62,grounded:true};signs=Array.from({length:9},(_,i)=>({x:240+i*270}));}
function burst(px,py,n,color){for(let i=0;i<n;i++)bits.push({x:px,y:py,vx:(Math.random()-.5)*280,vy:-Math.random()*300,life:.5+Math.random()*.5,color});}
function jump(){if(state==='playing'&&player.grounded){player.vy=-735;player.grounded=false;burst(150,ground,8,'#fff2a6')}}
function start(){reset();state='playing';overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function excuseFor(o){
 const lines={
  '🧦':['양말 한 짝이 너무 외로워 보여서 짝을 찾아주다 보니 시간이 다 갔어. 둘이 재회하는 순간 눈물까지 났다니까.','바닥에 떨어진 양말을 주웠는데 안에서 작은 쪽지가 나왔어. “주인을 찾아주세요.” 그 마지막 부탁을 외면할 수 없었어.','양말이 발에 착 감기길래 운명의 상대인 줄 알았어. 신어보고 벗어보고 궁합 보느라 늦었어.'],
  '🪑':['의자가 너무 편해 보여서 딱 5분만 앉으려 했어. 눈을 떠보니 해가 지고 내 인생도 저물었더라.','의자에 앉았는데 엉덩이가 떨어지질 않았어. 의자와 깊은 사랑에 빠진 것 같아. 축하해 줘.','지나가던 의자가 “잠깐 쉬었다 가”라고 속삭였어. 그 목소리가 너무 다정해서 거절하지 못했어.'],
  '🧻':['휴지가 너무 부드러워서 한 장만 만져보려 했는데, 감동해서 눈물을 닦다 보니 한 롤을 다 썼어.','휴지 한 칸을 뜯었는데 다음 칸이 계속 나왔어. 끝을 봐야 하는 성격이라 결국 롤 하나와 사투를 벌였어.','휴지가 바람에 날아가길래 잡으러 갔어. 저 멀리서도 계속 “날 잡아봐” 하더라.'],
  '🦆':['오리가 너무 귀여워서 사진 한 장만 찍으려 했어. 그런데 셀카 847장을 찍고 나니 메모리가 먼저 결혼하더라.','오리가 내 신발을 물고 도망갔어. 맨발로 쫓아가다 오리의 수영 실력에 패배했어.','오리가 길을 안내해 준다길래 따라갔지. 알고 보니 오리 가족 상견례에 나를 데려간 거였어. 빠져나올 수가 없었어.'],
  '🪴':['화분의 새싹이 너무 귀여워서 이름을 지어주고 물도 줬어. 그런데 “아빠”라고 부르는 것 같아서 발걸음이 안 떨어졌어.','화분이 너무 예뻐서 신혼집에 선물하려고 들었는데, 생각보다 무거워서 인생의 무게까지 깨달았어.','시든 잎 하나를 발견했어. 그냥 갈 수 없잖아. 응급처치하고 유언까지 들어주느라 늦었어.'],
  '🍉':['수박 먹느라 늦음.'],
  '🧍':['친척이 “요즘 만나는 사람은 있니?”라고 물었어. 대답하려는데 질문이 꼬리에 꼬리를 물어서 기자회견이 열렸어.','친척이 내 어릴 적 흑역사 사진을 꺼냈어. 그걸 회수하려고 협상하다가 몸값이 올라서 늦었어.','친척이 “너도 곧 좋은 소식 있지?”라고 했어. 좋은 소식이 뭔지 설명하다가 인생 상담 3시간 코스에 갇혔어.'],
  '📦':['답례품이 너무 탐나서 하나만 열어봤어. 안에 또 작은 상자가 있고, 그 안에 또 상자가 있고… 아직 마지막 상자를 못 찾았어.','답례품에서 고급 수건이 나왔어. 촉감이 너무 좋아서 얼굴에 대고 있다가 그대로 잠들 뻔했어.','상자에 “당첨”이라고 적혀 있길래 열었더니 종이 한 장이 나왔어. “축하합니다. 꽝입니다.” 억울해서 항의하느라 늦었어.'],
  '💐':['부케가 너무 예뻐서 향기를 맡았는데, 꽃향기에 취해 갑자기 인생의 주마등이 펼쳐졌어. 정신 차리니 늦었더라.','부케를 잠깐 들었을 뿐인데 주변에서 박수를 치기 시작했어. 얼떨결에 다음 결혼식 주인공 인터뷰까지 했어.','꽃다발에서 벌이 나왔어. 벌에게 사정을 설명하고 설득하다가 결국 꽃가루 알레르기까지 얻었어.'],
  '🧹':['빗자루가 너무 낡아 보여서 청소를 도와주려 했어. 바닥을 닦다 보니 내 인생의 먼지까지 보이더라.','빗자루를 타면 날 수 있을 것 같았어. 세 번 도전했는데 세 번 다 바닥과 진하게 포옹했어.','빗자루가 혼자 움직이길래 유령인 줄 알고 퇴마 의식을 했어. 알고 보니 바람이었는데 이미 굿판이 커졌어.'],
  '🐔':['닭이 너무 맛있어 보여서… 아니, 너무 귀여워서 따라갔어. 닭장 앞에서 작별 인사를 나누다 보니 시간이 사라졌어.','닭이 길을 막고 알을 낳았어. 부화할 때까지 기다려야 할 것 같아서 옆에서 응원했어.','닭이 나를 엄마로 착각하고 따라왔어. 버리고 갈 수 없어서 병아리 유치원까지 데려다주고 왔어.'],
  '🧊':['얼음이 너무 투명하고 예뻐서 감상하다가 목이 말라 한 입 먹었어. 한 입이 열 입이 되고 정신 차리니 늦었어.','얼음이 녹는 모습을 보고 있었어. 너무 아름답고 슬퍼서 마지막 물방울이 될 때까지 자리를 지켰어.','얼음 위에서 미끄러지는 게 생각보다 재밌더라. 한 번만 더, 진짜 마지막 한 번만 더 하다가 하루가 갔어.'],
  '🎂':['케이크가 너무 맛있어 보여서 크림만 살짝 맛봤어. 그런데 빵도 먹어야 균형이 맞잖아. 결국 3단을 완주했어.','케이크 위 딸기가 너무 탐스러워서 하나만 먹으려 했는데, 딸기 찾다 보니 케이크가 사라졌어. 미스터리야.','케이크를 보자마자 생일 축하 노래가 자동 재생됐어. 생일도 아닌데 세 번 부르고 촛불까지 불었어.'],
  '📸':['사진사가 “한 장만 찍을게요”라고 했는데 결과물이 너무 잘 나왔어. 인생샷을 고르다 보니 사진첩이 결혼식장보다 커졌어.','플래시가 터지는 순간 내 얼굴이 너무 잘생겨 보여서 셀카를 200장 찍었어. 이건 놓칠 수 없는 역사적 순간이야.','사진 찍을 때 눈 감았다고 다시 찍고, 또 감았다고 다시 찍고… 결국 눈 뜨는 법을 잊어버렸어.'],
  '🧾':['축의금 계좌번호를 입력하려는데 숫자가 너무 길었어. 한 자리씩 확인하다가 내 통장 잔고까지 확인하고 멘탈이 이체됐어.','축의금 액수를 정하다가 5만 원과 10만 원 사이에서 인류의 딜레마를 겪었어. 아직도 답을 못 찾았어.','계좌번호를 복사했는데 붙여넣기가 안 됐어. 21세기에 이런 비극이 일어날 줄은 몰랐어.'],
  '⚽':['마르세유턴하느라 늦음.'],
  '🖥️':['피파 이벤트 참여하느라 늦음.'],
  '🎬':['영화관에서 팝콘 먹느라 늦음.']
 };
 const choices=lines[o?.emoji]||['길에서 너무 충격적인 일이 벌어져서 설명할 시간이 필요해. 일단 내 잘못은 아니야.'];
 return choices[Math.random()*choices.length|0];
}
function finish(win,obstacle=null){
 state=win?'win':'dead';overlay.style.display='flex';
 const reason=obstacle?excuseFor(obstacle):'장애물과의 면담이 길어져서 늦었어.';
 overlay.innerHTML=`<div class="panel"><div class="big">${win?'💒🎉':'💥😭'}</div><h2>${win?'하니의 결혼식장 도착!':'길 위에서 전설이 되다'}</h2><p>${win?'기적적으로 도착했다. 이제 뷔페를 향해 전진!':'버틴 시간 '+Math.floor(time)+'초. 하니에게 보낼 노쇼 사유:'}</p>${win?'<p>신랑 신부보다 먼저 도착했을지도?</p>':`<p style="font-size:19px;background:#fff0f5;border:2px dashed #ff4e88;border-radius:12px;padding:13px;margin:12px 0">💬 “${reason}”</p><p style="font-size:13px;color:#777">사고 원인: ${obstacle?.emoji||'💥'} ${obstacle?.label||'알 수 없는 장애물'} · 변명 신뢰도: 0%</p>`}<button id="again">다시 도전하기</button></div>`;
 document.querySelector('#again').onclick=start
}
function addObstacle(){let a=silly[Math.random()*silly.length|0],s=48+Math.random()*20;obstacles.push({x:W+30,w:s,h:s+10,y:ground-s-5,label:a[1],emoji:a[0]})}
function background(){g.fillStyle='#a9e7ff';g.fillRect(0,0,W,H);
 for(let i=0;i<7;i++){let xx=((i*190-world*.18)%(W+180)+W+180)%(W+180)-80,yy=55+i%3*48;g.fillStyle='#ffffffcc';g.beginPath();g.arc(xx,yy,22,0,7);g.arc(xx+25,yy-8,29,0,7);g.arc(xx+52,yy,21,0,7);g.fill()}
 g.fillStyle='#8bd39c';g.beginPath();g.moveTo(0,350);for(let i=0;i<=W;i+=20)g.lineTo(i,340+Math.sin((i+world*.12)/80)*24);g.lineTo(W,H);g.lineTo(0,H);g.fill();
 for(let i=0;i<12;i++){let xx=((i*110-world*.32)%(W+100)+W+100)%(W+100)-50;g.fillStyle=i%2?'#ffd2df':'#fff0b8';g.fillRect(xx,260-i%3*22,55,170);g.fillStyle='white';for(let j=0;j<3;j++)g.fillRect(xx+10+j*14,275-i%3*22,7,10)}
 g.fillStyle='#535663';g.fillRect(0,ground,W,H-ground);g.fillStyle='#f7e6a0';g.fillRect(0,ground+8,W,5);
 for(let i=0;i<12;i++){let xx=((i*120-world)%(W+120)+W+120)%(W+120)-60;g.fillStyle='white';g.fillRect(xx,490,55,9)}
 for(let s of signs){let xx=s.x-world*.75;if(xx>-100&&xx<W+100){g.fillStyle='#76502f';g.fillRect(xx+5,300,9,130);g.fillStyle='#fff4cf';g.fillRect(xx-42,260,180,52);g.strokeStyle='#6a3e26';g.lineWidth=5;g.strokeRect(xx-42,260,180,52);g.fillStyle='#a52b61';g.font='bold 23px sans-serif';g.fillText('➡ 하니 결혼식장',xx-32,294)}}}
function drawPlayer(){g.save();g.translate(125,player.y);g.fillStyle='#25253255';g.beginPath();g.ellipse(28,65,27,7,0,0,7);g.fill();g.fillStyle='#252532';g.fillRect(9,43,13,20);g.fillRect(28,43,13,20);g.fillStyle='#263a64';g.fillRect(5,24,40,27);g.fillStyle='#f3c49c';g.beginPath();g.arc(26,13,17,0,7);g.fill();g.fillStyle='#20202a';g.fillRect(10,0,32,8);g.fillRect(10,5,7,8);g.fillStyle='white';g.fillRect(22,22,8,17);g.fillStyle='#ff4e88';g.beginPath();g.moveTo(25,24);g.lineTo(31,31);g.lineTo(25,40);g.lineTo(22,31);g.fill();g.restore()}
function loop(now){if(state!=='playing')return;let dt=Math.min((now-last)/1000,.035);last=now;time+=dt;world+=speed*dt;speed=570+time*8.5;spawn-=dt;
 if(spawn<=0){spawn=Math.max(.27,.82-Math.random()*.25-time*.009);addObstacle();if(time>7&&Math.random()<.72)setTimeout(()=>{if(state==='playing')addObstacle()},145)}
 player.vy+=2200*dt;player.y+=player.vy*dt;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.grounded=true}
 obstacles.forEach(o=>{o.x-=speed*dt;if(o.x+o.w<125)o.passed||(o.passed=true,passed++)});obstacles=obstacles.filter(o=>o.x>-100);
 for(let o of obstacles)if(164>o.x+7&&125<o.x+o.w-7&&player.y+player.h>o.y+12&&player.y+8<o.y+o.h){burst(145,player.y+30,24,'#ff4e88');finish(false,o);return}
 if(time>=TOTAL){finish(true);return}
 background();drawPlayer();for(let o of obstacles){
  g.save();
  // 장애물 자체는 밝은 테두리로 강조
  g.textAlign='center';
  g.font=`${o.h+4}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  g.lineWidth=5; g.strokeStyle='#ffffff'; g.strokeText(o.emoji,o.x+o.w/2,o.y+o.h);
  g.fillText(o.emoji,o.x+o.w/2,o.y+o.h);
  // 이름표: 검은 바탕 + 노란 테두리 + 큰 글씨
  const label=o.label, fs=19, pad=11;
  g.font=`1000 ${fs}px system-ui,sans-serif`;
  const tw=g.measureText(label).width, bw=Math.max(o.w+22,tw+pad*2), bh=34;
