<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>하니의 결혼식장까지 살아남기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171923;color:white;font-family:system-ui,"Malgun Gothic",sans-serif;display:grid;place-items:center;padding:14px}.wrap{width:min(100%,980px)}.top,.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top{margin-bottom:10px}h1{font-size:clamp(20px,4vw,30px);margin:0;font-weight:1000}.pill{background:#292d3b;border:1px solid #555;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:900}.gamebox{position:relative;border:3px solid white;border-radius:18px;overflow:hidden;background:#a9e7ff;box-shadow:0 12px 0 #080910}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;z-index:10;display:flex;pointer-events:auto;align-items:center;justify-content:center;text-align:center;background:#111827d9;padding:15px}.panel{max-width:560px;background:white;color:#20202a;border:4px solid #20202a;border-radius:18px;padding:22px;box-shadow:8px 8px 0 #ff4e88}.panel h2{font-size:clamp(25px,5vw,42px);margin:0 0 8px;line-height:1.1}.panel p{font-weight:750;line-height:1.55}.big{font-size:42px}button{position:relative;z-index:11;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;border:0;background:#ff4e88;color:white;font-weight:1000;font-size:17px;padding:13px 24px;border-radius:12px;box-shadow:0 5px 0 #a82254;cursor:pointer;margin-top:8px}.controls{margin-top:12px;color:#d9dbea;font-size:13px;font-weight:800}.touch{display:none;gap:8px;position:relative;z-index:20;pointer-events:auto}.touch button{margin:0;padding:11px 16px;font-size:14px}@media(max-width:650px){
body{display:block;min-height:100svh;padding:18px 8px 24px}
.wrap{width:100%;max-width:560px;margin:0 auto}
.top{align-items:flex-start;gap:7px;margin-bottom:9px}
h1{font-size:clamp(20px,5vw,26px);line-height:1.2}
.pill{font-size:11px;padding:6px 10px}
.gamebox{width:100%}
.overlay{padding:7px;overflow-y:auto}
.panel{width:100%;max-width:100%;max-height:100%;overflow-y:auto;padding:9px 11px;border-width:3px;border-radius:14px;box-shadow:5px 5px 0 #ff4e88}
.panel .big{font-size:24px;line-height:1}
.panel h2{font-size:clamp(20px,5vw,27px);line-height:1.08;margin:2px 0 5px}
.panel p{font-size:clamp(11px,2.9vw,14px);line-height:1.25;margin:5px 0}
.panel button{font-size:15px;padding:9px 16px;margin-top:3px;min-height:42px}
.controls{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:10px;font-size:12px}
.controls>span{line-height:1.3}
.touch{display:flex;width:100%;gap:10px}
.touch button{flex:1;min-height:58px;font-size:18px;padding:14px 10px}
.desktop{display:none}
}
</style></head><body><div class="wrap"><div class="top"><h1>💍 하니의 결혼식장까지 살아남기</h1><span class="pill">난이도: 하드코어 · 자비 없음</span></div>
<div class="gamebox"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="big">🏃‍♂️💨</div><h2>식장까지 60초</h2><p>표지판을 따라 하니의 결혼식장으로 가라!<br>근데 길이 왜 이 모양이지?</p><p>SPACE / ↑ : 점프<br>장애물에 닿으면 즉시 사망 · 60초 버티면 도착</p><p>※ 현실의 지각은 게임 오버보다 무섭습니다.</p><button id="start" type="button">운명의 질주 시작</button></div></div></div>
<div class="controls"><span class="desktop">키보드: SPACE 또는 ↑ 점프 · R 재시작</span><span>남은 시간: 60초 · 난이도: 지옥 · 연속 장애물 주의</span><div class="touch"><button id="jump" type="button">점프! ⬆</button><button id="restart" type="button">다시 시작</button></div></div></div>
<script>
(()=>{
const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),W=960,H=540,ground=430,TOTAL=60;
let state='ready',last=0,time=0,world=0,speed=570,player,obstacles=[],bits=[],spawn=0,passed=0,signs=[];
const silly=[['🧦','짝 잃은 양말'],['🪑','갑자기 놓인 의자'],['🧻','축의금 영수증 폭탄'],['🦆','청첩장 훔치는 오리'],['🪴','대형 화분'],['🍉','미끄러운 수박'],['🧍','길막하는 친척'],['📦','정체불명 답례품'],['💐','거대 부케'],['🧹','빗자루의 반란'],['🐔','예식장 탈주 닭'],['🧊','바닥의 얼음덩이'],['🎂','굴러오는 3단 케이크'],['📸','플래시 카메라'],['🧾','축의금 계좌번호 안내판']];
function reset(){time=world=passed=0;speed=570;spawn=.55;obstacles=[];bits=[];player={y:ground-62,vy:0,h:62,grounded:true};signs=Array.from({length:9},(_,i)=>({x:240+i*270}));}
function burst(px,py,n,color){for(let i=0;i<n;i++)bits.push({x:px,y:py,vx:(Math.random()-.5)*280,vy:-Math.random()*300,life:.5+Math.random()*.5,color});}
function jump(){if(state==='ready')start();if(state==='playing'&&player.grounded){player.vy=-735;player.grounded=false;burst(150,ground,8,'#fff2a6')}}
function start(){reset();state='playing';overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function finish(win){state=win?'win':'dead';overlay.style.display='flex';overlay.innerHTML=`<div class="panel"><div class="big">${win?'💒🎉':'💥😭'}</div><h2>${win?'하니의 결혼식장 도착!':'길 위에서 전설이 되다'}</h2><p>${win?'기적적으로 도착했다. 이제 뷔페를 향해 전진!':'버틴 시간 '+Math.floor(time)+'초. 하니에게 적당히 둘러대자.'}</p><p>${win?'신랑 신부보다 먼저 도착했을지도?':'장애물에 걸려 넘어졌다. 다음 생에는 택시를 타세요.'}</p><button id="again">다시 도전하기</button></div>`;document.querySelector('#again').onclick=start}
function addObstacle(){let a=silly[Math.random()*silly.length|0],s=48+Math.random()*20;obstacles.push({x:W+30,w:s,h:s+10,y:ground-s-5,label:a[1],emoji:a[0]})}
function background(){g.fillStyle='#a9e7ff';g.fillRect(0,0,W,H);
 for(let i=0;i<7;i++){let xx=((i*190-world*.18)%(W+180)+W+180)%(W+180)-80,yy=55+i%3*48;g.fillStyle='#ffffffcc';g.beginPath();g.arc(xx,yy,22,0,7);g.arc(xx+25,yy-8,29,0,7);g.arc(xx+52,yy,21,0,7);g.fill()}
 g.fillStyle='#8bd39c';g.beginPath();g.moveTo(0,350);for(let i=0;i<=W;i+=20)g.lineTo(i,340+Math.sin((i+world*.12)/80)*24);g.lineTo(W,H);g.lineTo(0,H);g.fill();
 for(let i=0;i<12;i++){let xx=((i*110-world*.32)%(W+100)+W+100)%(W+100)-50;g.fillStyle=i%2?'#ffd2df':'#fff0b8';g.fillRect(xx,260-i%3*22,55,170);g.fillStyle='white';for(let j=0;j<3;j++)g.fillRect(xx+10+j*14,275-i%3*22,7,10)}
 g.fillStyle='#535663';g.fillRect(0,ground,W,H-ground);g.fillStyle='#f7e6a0';g.fillRect(0,ground+8,W,5);
 for(let i=0;i<12;i++){let xx=((i*120-world)%(W+120)+W+120)%(W+120)-60;g.fillStyle='white';g.fillRect(xx,490,55,9)}
 for(let s of signs){let xx=s.x-world*.75;if(xx>-100&&xx<W+100){g.fillStyle='#76502f';g.fillRect(xx+5,300,9,130);g.fillStyle='#fff4cf';g.fillRect(xx-42,260,180,52);g.strokeStyle='#6a3e26';g.lineWidth=5;g.strokeRect(xx-42,260,180,52);g.fillStyle='#a52b61';g.font='bold 23px sans-serif';g.fillText('➡ 하니 결혼식장',xx-32,294)}}}
function drawPlayer(){g.save();g.translate(125,player.y);g.fillStyle='#25253255';g.beginPath();g.ellipse(28,65,27,7,0,0,7);g.fill();g.fillStyle='#252532';g.fillRect(9,43,13,20);g.fillRect(28,43,13,20);g.fillStyle='#263a64';g.fillRect(5,24,40,27);g.fillStyle='#f3c49c';g.beginPath();g.arc(26,13,17,0,7);g.fill();g.fillStyle='#20202a';g.fillRect(10,0,32,8);g.fillRect(10,5,7,8);g.fillStyle='white';g.fillRect(22,22,8,17);g.fillStyle='#ff4e88';g.beginPath();g.moveTo(25,24);g.lineTo(31,31);g.lineTo(25,40);g.lineTo(22,31);g.fill();g.restore()}
function loop(now){if(state!=='playing')return;let dt=Math.min((now-last)/1000,.035);last=now;time+=dt;world+=speed*dt;speed=570+time*8.5;spawn-=dt;
 if(spawn<=0){spawn=Math.max(.27,.82-Math.random()*.25-time*.009);addObstacle();if(time>7&&Math.random()<.72)setTimeout(()=>{if(state==='playing')addObstacle()},145)}
 player.vy+=2200*dt;player.y+=player.vy*dt;if(player.y>=ground-player.h){player.y=ground-player.h;player.vy=0;player.grounded=true}
 obstacles.forEach(o=>{o.x-=speed*dt;if(o.x+o.w<125)o.passed||(o.passed=true,passed++)});obstacles=obstacles.filter(o=>o.x>-100);
 for(let o of obstacles)if(164>o.x+7&&125<o.x+o.w-7&&player.y+player.h>o.y+12&&player.y+8<o.y+o.h){burst(145,player.y+30,24,'#ff4e88');finish(false);return}
 if(time>=TOTAL){finish(true);return}
 background();drawPlayer();for(let o of obstacles){
  g.save();
  // 장애물 자체는 밝은 테두리로 강조
  g.textAlign='center';
  g.font=`${o.h+4}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  g.lineWidth=5; g.strokeStyle='#ffffff'; g.strokeText(o.emoji,o.x+o.w/2,o.y+o.h);
  g.fillText(o.emoji,o.x+o.w/2,o.y+o.h);
  // 이름표: 검은 바탕 + 노란 테두리 + 큰 글씨
  const label=o.label, fs=19, pad=11;
  g.font=`1000 ${fs}px system-ui,sans-serif`;
  const tw=g.measureText(label).width, bw=Math.max(o.w+22,tw+pad*2), bh=34;
  let bx=o.x+o.w/2-bw/2, by=o.y-48;
  bx=Math.max(8,Math.min(W-bw-8,bx));
  g.fillStyle='#171923';g.strokeStyle='#ffe36e';g.lineWidth=3;
  g.beginPath();g.roundRect(bx,by,bw,bh,9);g.fill();g.stroke();
  g.fillStyle='#ffffff';g.textAlign='center';g.textBaseline='middle';
  g.fillText(label,bx+bw/2,by+bh/2+1);
  g.restore();
}
 bits.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt;g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.color;g.fillRect(p.x,p.y,5,5)});bits=bits.filter(p=>p.life>0);g.globalAlpha=1;
 g.fillStyle='#171923dd';g.fillRect(18,16,260,62);g.fillStyle='white';g.font='bold 17px sans-serif';g.fillText('식장까지 버티기',32,41);g.fillStyle='#ffe36e';g.font='bold 24px sans-serif';g.fillText(Math.max(0,TOTAL-time).toFixed(1)+'초',32,67);g.fillStyle='#171923bb';g.fillRect(300,25,620,18);g.fillStyle='#ff4e88';g.fillRect(300,25,620*time/TOTAL,18);g.strokeStyle='white';g.lineWidth=2;g.strokeRect(300,25,620,18);g.fillStyle='#171923';g.font='bold 13px sans-serif';g.fillText('통과한 장애물: '+passed+'개',760,68);requestAnimationFrame(loop)}
window.haniStartGame=start;window.haniJumpGame=jump;window.haniRestartGame=()=>{if(state!=='ready')start()};
document.querySelector('#start').addEventListener('click',start);document.querySelector('#jump').addEventListener('click',jump);document.querySelector('#restart').addEventListener('click',()=>{if(state!=='ready')start()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='KeyR')start()});c.addEventListener('pointerdown',()=>{if(state==='playing')jump()});reset();background();drawPlayer();
})();
</script></body></html>
